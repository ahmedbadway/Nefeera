<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Nefeera — Wedding Planning &amp; Design by Yomna El Hadad</title>
    <meta
      name="description"
      content="Nefeera plans and designs weddings across Egypt with a small number of couples each season. Full planning, design direction, and day-of production led by Yomna El Hadad."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#FAF9F4" />

    <!--
      Open Graph URLs must be absolute — Facebook, WhatsApp, and X fetch them
      from their own servers, where a site-relative path means nothing. Vite
      rewrites src/href attributes for the deployment base but not meta content,
      so these carry the full origin.

      UPDATE BOTH IF THE DOMAIN CHANGES (custom domain, Vercel, Netlify).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ahmedbadway.github.io/Nefeera/" />
    <meta property="og:title" content="Nefeera — Wedding Planning &amp; Design by Yomna El Hadad" />
    <meta
      property="og:description"
      content="Full wedding planning, design direction, and day-of production across Egypt. A small number of couples each season."
    />
    <meta
      property="og:image"
      content="https://ahmedbadway.github.io/Nefeera/assets/images/hero-poster.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Italiana ships weight 400 only — requesting other weights is a no-op.

      Reem Kufi and Tajawal carry the Arabic. Neither Italiana nor Outfit has a
      single Arabic glyph, so without these the Arabic side of the site would
      fall back to whatever the device happens to have. Reem Kufi keeps the
      display type refined rather than calligraphic, which is the same register
      Italiana holds in English.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Italiana&family=Outfit:wght@300..600&family=Reem+Kufi:wght@400..700&family=Tajawal:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
